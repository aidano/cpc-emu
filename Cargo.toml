[package]
name = "cpc_emu"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "3.1.6", features = ["derive"] }
env_logger = "0.10.0"
log = "0.4.17"
slint = { version = "1", optional = true }
# Same crate slint uses as its desktop backend; a direct dependency gives
# access to the underlying winit window (WinitWindowAccessor).
i-slint-backend-winit = { version = "1.7", default-features = false, optional = true }
cpal = { version = "0.15", optional = true }
# Gamepad polling: XInput/DirectInput on Windows, evdev+libudev on Linux,
# IOKit HID on macOS (all OS-bundled; Linux needs libudev).
gilrs = { version = "0.11", optional = true }

[features]
default = ["gui", "audio", "joystick"]
gui = ["dep:slint", "dep:i-slint-backend-winit"]
audio = ["dep:cpal"]
joystick = ["dep:gilrs"]

[build-dependencies]
slint-build = "1"

[dev-dependencies]
i-slint-backend-testing = "1.18.0"
