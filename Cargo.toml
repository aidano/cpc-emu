[package]
name = "cpc_emu"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "3.1.6", features = ["derive"] }
env_logger = "0.10.0"
log = "0.4.17"
slint = { version = "1", optional = true }

[features]
default = ["gui"]
gui = ["dep:slint"]

[build-dependencies]
slint-build = "1"